# meteor.cfg - meteor の cc65 版のリンカ設定（v2：$0200 から読み込み、RAM は $7EFF まで）
# ゼロページは $20 から（$00〜$1F はモニタが使う）。
# C のスタックの先頭は $7EF0（ページの境目に置くと、スタックを積むたびに上位バイトの繰り下げが起きて遅くなるため）
FEATURES {
    STARTADDRESS: default = $0200;
}
SYMBOLS {
    __STACKSIZE__: type = weak, value = $0400;        # C のスタック（ソフトウェアスタック）1KB
}
MEMORY {
    ZP:   file = "", start = $0020, size = $00E0, define = yes;   # $00-$1F はモニタが使うので避ける
    MAIN: file = %O, start = $0200, size = $7EF0 - $0200 - __STACKSIZE__, define = yes;   # 末尾＋スタック = $7EF0
}
SEGMENTS {
    ZEROPAGE: load = ZP,   type = zp;
    STARTUP:  load = MAIN, type = ro;
    LOWCODE:  load = MAIN, type = ro,  optional = yes;
    ONCE:     load = MAIN, type = ro,  optional = yes;
    CODE:     load = MAIN, type = ro;
    RODATA:   load = MAIN, type = ro;
    DATA:     load = MAIN, type = rw;
    INIT:     load = MAIN, type = bss, optional = yes;
    BSS:      load = MAIN, type = bss, define = yes;
}
FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__, count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor,  label = __DESTRUCTOR_TABLE__,  count = __DESTRUCTOR_COUNT__,  segment = RODATA;
}
